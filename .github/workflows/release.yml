# Builds and uploads the desktop installers when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag must match "version" in package.json. The release is created as a draft;
# publish it on GitHub once you've checked it.
#
# Installers are signed when the signing secrets exist (see docs/RELEASING.md) and
# unsigned otherwise: macOS gets an ad-hoc signature, so users can approve it once
# under System Settings → Privacy & Security, and Windows shows a SmartScreen prompt.
name: Release desktop app

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets

jobs:
  # Create the draft first so the four build jobs don't race to create it.
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"; exit 1; }
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "PaperLens $GITHUB_REF_NAME" --generate-notes

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: --mac --arm64 }
          - { os: macos-15-intel, target: --mac --x64 }
          - { os: windows-latest, target: --win --x64 }
          - { os: ubuntu-latest, target: --linux --x64 }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the bundled server
        run: npm run desktop:bundle

      - name: Choose signed or unsigned
        id: sign
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        run: |
          if [ "$RUNNER_OS" = macOS ] && [ -z "$MAC_CSC_LINK" ]; then
            echo "::warning::No Mac signing secrets; building an unsigned (ad-hoc) app"
            echo "flags=-c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and upload installer
        shell: bash
        # Unset missing secrets: electron-builder reads an empty CSC_LINK as a path to the project folder.
        run: |
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
          [ -n "$WIN_CSC_LINK" ] || unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          npx electron-builder ${{ matrix.target }} ${{ steps.sign.outputs.flags }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: Developer ID Application certificate (.p12, base64) + notarization
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: code-signing certificate (.pfx, base64); unsigned when absent
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
